name: Build and publish beta.29
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.Ray_Chen/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: beta29-release
  cancel-in-progress: true
jobs:
  build-release:
    runs-on: windows-latest
    env:
      PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build app
        shell: pwsh
        run: |
          dotnet publish src/MemoryManager/MemoryManager.csproj -c Release -r win-x64 --self-contained true -o artifacts/app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path artifacts/app/MemoryManager.exe)) { throw 'MemoryManager.exe was not produced' }
          New-Item -ItemType Directory -Force installer/MemoryManagerSetup/Payload | Out-Null
          Copy-Item artifacts/app/MemoryManager.exe installer/MemoryManagerSetup/Payload/MemoryManager.exe -Force
      - name: Run Windows self-test
        shell: pwsh
        run: |
          $exe = (Resolve-Path artifacts/app/MemoryManager.exe).Path
          $out = Join-Path $pwd 'artifacts/selftest.json'
          $p = Start-Process -FilePath $exe -ArgumentList @('--self-test', $out) -Wait -PassThru
          if ($p.ExitCode -ne 0) { if (Test-Path $out) { Get-Content $out }; throw "Self-test failed with exit code $($p.ExitCode)" }
          if (!(Test-Path $out)) { throw 'Self-test JSON was not produced' }
          $report = Get-Content $out -Raw | ConvertFrom-Json
          if (-not $report.ok) { Get-Content $out; throw 'Self-test report returned ok=false' }
          Get-Content $out
      - name: Build real installer
        shell: pwsh
        run: |
          dotnet publish installer/MemoryManagerSetup/MemoryManagerSetup.csproj -c Release -r win-x64 --self-contained true -o artifacts/setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path artifacts/setup/MemoryManagerSetup.exe)) { throw 'MemoryManagerSetup.exe was not produced' }
          Copy-Item artifacts/setup/MemoryManagerSetup.exe artifacts/MemoryManagerSetup.exe -Force
          Copy-Item artifacts/app/MemoryManager.exe artifacts/MemoryManager.exe -Force
      - name: Installer V2 install repair uninstall audit
        shell: pwsh
        run: |
          $setup = (Resolve-Path artifacts/setup/MemoryManagerSetup.exe).Path
          $target = Join-Path $env:RUNNER_TEMP 'MemoryManager-InstallerV2-Test'
          if(Test-Path $target){Remove-Item $target -Recurse -Force}
          $p = Start-Process -FilePath $setup -ArgumentList @('--install','--quiet','--target',$target,'--no-shell') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "quiet install failed: $($p.ExitCode)"}
          foreach($f in 'MemoryManager.exe','MemoryManagerSetup.exe','install-state.txt'){if(!(Test-Path (Join-Path $target $f))){throw "install missing $f"}}
          $sourceHash=(Get-FileHash artifacts/app/MemoryManager.exe -Algorithm SHA256).Hash
          $installedHash=(Get-FileHash (Join-Path $target 'MemoryManager.exe') -Algorithm SHA256).Hash
          if($sourceHash -ne $installedHash){throw 'installed payload hash differs from build payload'}
          $p = Start-Process -FilePath $setup -ArgumentList @('--repair','--quiet','--target',$target,'--no-shell') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "quiet repair failed: $($p.ExitCode)"}
          $repairedHash=(Get-FileHash (Join-Path $target 'MemoryManager.exe') -Algorithm SHA256).Hash
          if($sourceHash -ne $repairedHash){throw 'repair payload hash differs from build payload'}
          $p = Start-Process -FilePath $setup -ArgumentList @('--uninstall','--quiet','--target',$target,'--no-shell') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "quiet uninstall failed: $($p.ExitCode)"}
          if(Test-Path $target){throw 'uninstall left test install directory behind'}
          "Installer V2 cycle OK: install -> repair -> uninstall; payload sha256=$($sourceHash.ToLower())"
      - name: Optional Authenticode signing
        if: ${{ env.PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:PFX_BASE64))
          $signtool=(Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:PFX_PASSWORD artifacts/MemoryManager.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:PFX_PASSWORD artifacts/MemoryManagerSetup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $signtool verify /pa /all artifacts/MemoryManager.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $signtool verify /pa /all artifacts/MemoryManagerSetup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Hash artifacts
        shell: pwsh
        run: |
          $files='artifacts/MemoryManager.exe','artifacts/MemoryManagerSetup.exe'
          $lines = foreach($f in $files){$h=(Get-FileHash $f -Algorithm SHA256).Hash.ToLower(); "$h  $([IO.Path]::GetFileName($f))"}
          $lines | Set-Content artifacts/SHA256SUMS.txt
      - name: Verify SHA256 manifest
        shell: pwsh
        run: |
          $manifest = Get-Content artifacts/SHA256SUMS.txt
          foreach($f in 'artifacts/MemoryManager.exe','artifacts/MemoryManagerSetup.exe'){
            $name=[IO.Path]::GetFileName($f)
            $actual=(Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $line=$manifest | Where-Object { $_ -match ('\s+' + [regex]::Escape($name) + '$') } | Select-Object -First 1
            if(!$line){throw "SHA256SUMS missing $name"}
            $recorded=($line -split '\s+')[0].ToLower()
            if($recorded -ne $actual){throw "SHA256SUMS mismatch for $name"}
            "verified $name sha256=$actual"
          }
      - name: Smoke-check files
        shell: pwsh
        run: |
          if(!(Test-Path artifacts/MemoryManager.exe)){throw 'MemoryManager.exe missing'}
          if(!(Test-Path artifacts/MemoryManagerSetup.exe)){throw 'MemoryManagerSetup.exe missing'}
          if(!(Test-Path artifacts/selftest.json)){throw 'selftest.json missing'}
          Get-Item artifacts/MemoryManager.exe, artifacts/MemoryManagerSetup.exe, artifacts/SHA256SUMS.txt, artifacts/selftest.json | Format-Table Name,Length
      - name: Publish GitHub Release assets
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v0.9.0-beta.29'
          if(gh release view $tag 2>$null){
            gh release upload $tag artifacts/MemoryManager.exe artifacts/MemoryManagerSetup.exe artifacts/SHA256SUMS.txt --clobber
          } else {
            gh release create $tag artifacts/MemoryManager.exe artifacts/MemoryManagerSetup.exe artifacts/SHA256SUMS.txt --title 'Memory Manager v0.9.0-beta.29' --notes-file CHANGELOG.md --prerelease --target main
          }
